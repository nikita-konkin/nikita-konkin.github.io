  status_ru: "Исследование"
  status_en: "Research"
  description: "Состязательная (GAN) генерация структурированных помех фиксированной мощности для оценки уязвимости FEC-кодов КВ-связи. Сравнивает BER FEC-схем (сверточный K=7 R=1/2, BCH(63,51), турбо-код) в идеальном канале, при замираниях Рэлея и Риса и под обученным генератором шума."
  description_en: "Adversarial (GAN) generation of structured, fixed-power interference to probe the vulnerability of the FEC codes used in HF radio. It compares the BER of several FEC schemes (convolutional K=7 R=1/2, BCH(63,51), turbo) in an ideal channel, under Rayleigh and Rician fading, and against a trained noise generator."
  stack:
    - Python
    - PyTorch
    - NumPy
    - SciPy
    - GAN
    - DSP
  highlights:
    - "FEC по стандартам КВ-связи: сверточный код с soft-decision Viterbi (MIL-STD-188-110, STANAG 4285), BCH(63,51) для ALE, заготовка турбо-кода STANAG 4539 и блоковый интерливинг 16×16."
    - "Генератор шума (FC → Conv1D → LSTM → Conv1D) против CNN-дискриминатора, предсказывающего отказ декодирования, — помеха фиксированной мощности учится обходить именно FEC."
    - "Модели каналов AWGN, Рэлея и Риса и спектральный анализ (FFT, PSD Уэлча) наиболее эффективных помеховых структур."
  highlights_en:
    - "FEC to HF communication standards: a convolutional code with soft-decision Viterbi (MIL-STD-188-110, STANAG 4285), BCH(63,51) for ALE, a STANAG 4539 turbo-code stub, and 16×16 block interleaving."
    - "A noise generator (FC → Conv1D → LSTM → Conv1D) against a CNN discriminator that predicts a decoding failure — fixed-power interference learns to defeat the FEC specifically."
    - "AWGN, Rayleigh, and Rician channel models, plus spectral analysis (FFT, Welch PSD) of the most effective interference structures."
  references:
