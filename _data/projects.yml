- slug: gd_learn
  name: gd-learn
  title: "Gradient Descent Playground — интерактивный тренажёр градиентного спуска"
  title_en: "Gradient Descent Playground — an interactive gradient-descent sandbox"
  status: "Учебный проект"
  status_ru: "Учебный проект"
  status_en: "Educational project"
  description: "Streamlit-приложение для наглядного изучения градиентного спуска: генерирует синтетические данные, обучает полиномиальные модели тремя видами спуска (Batch, SGD, Mini-batch) по MSE или MAE и показывает график потерь, анимацию шагов и 3D-поверхность функции потерь с траекторией оптимизации."
  description_en: "A Streamlit app for learning gradient descent by sight: it generates synthetic data, trains polynomial models with three descent variants (Batch, SGD, Mini-batch) under MSE or MAE, and shows the loss curve, a step-by-step animation, and a 3D loss surface with the optimization trajectory."
  repo: https://gitflic.ru/project/nikita-konkin/gd_learn
  repo_label_ru: "Репозиторий (GitFlic)"
  repo_label_en: "Repository (GitFlic)"
  stack:
    - Python
    - Streamlit
    - NumPy
    - pandas
    - Plotly
    - pytest
  highlights:
    - "Три вида градиентного спуска (Batch, SGD, Mini-batch) и две функции потерь (MSE, MAE) на общих данных — для прямого сравнения."
    - "Анимация шагов оптимизации и 3D-поверхность потерь с траекторией спуска по двум выбранным параметрам."
    - "Автоматическое обнаружение расходимости: неустойчивая история обрезается на последней стабильной итерации."
  highlights_en:
    - "Three descent variants (Batch, SGD, Mini-batch) and two loss functions (MSE, MAE) over shared data — for direct comparison."
    - "An animation of the optimization steps and a 3D loss surface with the descent trajectory over two chosen parameters."
    - "Automatic divergence detection: an unstable history is truncated at the last stable iteration."
  references:
