- slug: open_diplom
  name: open-diplom
  title: "Открытый диплом — открытая замена «КиберДиплома»"
  title_en: "Otkrytyi Diplom — an open replacement for CyberDiploma"
  status: "Прототип"
  status_ru: "Прототип"
  status_en: "Prototype"
  description: "Открытая система подготовки и печати дипломов и приложений к ним для вузов, в том числе со старыми компьютерами на Windows 7 и российскими Linux. Одна сборка на Java 11 работает и на компьютере без сети, и на сервере вуза."
  description_en: "An open system for preparing and printing diplomas and their supplements, including at universities with old Windows 7 machines and Russian Linux distributions. A single Java 11 build runs both on an offline computer and on a university server."
  repo: https://github.com/nikita-konkin/open-diplom
  stack:
    - Java 11
    - Tomcat
    - SQLite
    - Apache POI
    - PDFBox
    - Maven
    - Docker
  highlights:
    - "Импорт ведомостей «Деканата» через промежуточную зону: семестры складываются, з.е. берутся из учебного плана, спорные строки помечаются для оператора."
    - "Учебный план из PDF «Планов» читается по сетке таблицы; шапка и итоги плана заполняют поля XML."
    - "Печать в миллиметрах с калибровкой принтера; правила текущего сервиса перенесены и сверены с ним побайтно на архиве."
    - "Учебные планы по годам набора и редакциям: контрольные суммы, сравнение с ближайшим планом и «Создать на основе» для планов, которые есть только сканом."
    - "Выпуск от ведомости до бланка: сопоставление с планом, регистрационные номера, правки поверх файлов, печать по шаблонам типографии FastReport и учёт бланков строгой отчётности с книгой регистрации."
  highlights_en:
    - "Import of faculty grade statements through a staging area: semesters are summed, credits come from the curriculum, doubtful rows are flagged for the operator."
    - "Curricula saved as PDF are read by the table's grid; the plan's title and totals fill the XML fields."
    - "Printing in millimetres with printer calibration; the current service's rules are ported and checked against it byte for byte on the archive."
    - "Curricula by admission year and edition: checksums, comparison with the nearest plan and «Create from» for plans that exist only as scans."
    - "A graduation from grade statement to blank: matching to the curriculum, registration numbers, corrections laid over the files, printing from the typographer's FastReport templates and strict-control blank accounting with a registration book."

