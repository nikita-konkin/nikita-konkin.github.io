      note_en: "An interactive account of the dynamics of gradient descent with momentum."
    - label: "Setosa — Ordinary Least Squares"
      url: "https://setosa.io/ev/ordinary-least-squares-regression/"
      note: "Визуальное объяснение подгонки методом наименьших квадратов."
      note_en: "A visual explanation of least-squares fitting."
    - label: "3Blue1Brown — Neural networks"
      url: "https://www.3blue1brown.com/topics/neural-networks"
