      url: "https://arxiv.org/abs/1702.00832"
      note: "Основополагающая работа о сквозном обучении физического уровня как автокодировщика."
      note_en: "The foundational paper on learning the physical layer end-to-end as an autoencoder."
    - label: "Nachmani et al. — Learning to Decode Linear Codes"
      url: "https://arxiv.org/abs/1607.04793"
      note: "Нейросетевое улучшение декодирования линейных кодов — ML со стороны декодера."
      note_en: "Neural-network improvement of linear-code decoding — ML on the decoder side."
    - label: "Sadeghi & Larsson — Adversarial Attacks on Radio Signal Classification"
      url: "https://arxiv.org/abs/1808.07713"
      note: "Состязательные возмущения в беспроводной связи — тот же ракурс атаки на приёмник."
      note_en: "Adversarial perturbations in wireless — the same attack angle against the receiver."
