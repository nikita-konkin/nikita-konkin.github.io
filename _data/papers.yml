# Register of publications, keyed by eLibrary item id.
#
# The id is the join key across three places: the link (item.asp?id=<id>), the
# local PDF in pdf/ and the review that discusses the paper (_reviews/<slug>.md,
# matched through its paper_link). The register mirrors the author's eLibrary
# list (author_items.asp?authorid=930081, 137 records on 2026-11-21) and feeds
# the publication list at /science/publications/. eLibrary needs a logged-in
# session, so this file is the copy of record; scripts/papers_scan.py checks it
# against what is on disk.
#
# Entries are sorted by id; `review:` is what says whether a paper is written
# up, so do not rely on where an entry sits in the file.
#
# `pdf:`               elibrary_<id>_<n>.pdf is an eLibrary download; when the paper
#                      was cut from a whole downloaded volume, <n> is that volume's
#                      file id. nptm_<id>.pdf is cut from an open volume of the
#                      «Научному прогрессу – творчество молодых» proceedings, which
#                      `source:` names.
# `pdf: null`          no open full text.
# `review: null`       not yet written up; this is the science backlog.
# `role: supervisor`   a student paper listed through supervision, not authorship.
# `duplicate_of:`      a second eLibrary record of the same paper; the list skips it.
#
# Titles, authors and venues come from the PDFs where there are any, otherwise
# from the eLibrary records. Fields left null are genuinely unknown.

