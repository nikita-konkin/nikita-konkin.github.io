title: Nikita Konkin
tagline: Projects, public articles and engineering updates
description: Персональный сайт с проектами, публичными статьями и заметками по разработке.
url: "https://nikita-konkin.github.io"
baseurl: ""
lang: ru
timezone: Europe/Moscow
markdown: kramdown
permalink: pretty

author:
  name: Nikita Konkin
  role: Full stack developer (or not?)

social:
  github: "https://github.com/nikita-konkin"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# jekyll-feed: publish the articles collection as an Atom feed at /feed.xml
feed:
  collections:
    articles:
      path: "/feed.xml"

collections:
  articles:
    output: true
    permalink: /blog/:path/
  reviews:
    output: true
    permalink: /science/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: "_articles"
      type: articles
    values:
      layout: article
      author: Nikita Konkin
      lang: ru
  - scope:
      path: "_reviews"
      type: reviews
    values:
      layout: review
      lang: ru

# Jekyll REPLACES its built-in exclude list when this key is set, so the stock
# entries (Gemfile, vendor/*, caches) have to be repeated here alongside ours.
# Without them the Ruby toolchain and the test suite are copied into _site and
# served on the live domain.
exclude:
  # Repo docs and local toolchain
  - README.md
  - Gemfile
  - Gemfile.lock
  - gemfiles
  - assets/fonts/README.md
  # Test suite and publishing scripts - source only, never served
  - tests/
  - notes/
  - scripts/
  - skills
  - pytest.ini
  - .pytest_cache/
  # The PDFs themselves are published; this is just the working links list.
  - pdf/pdf_links.txt
  # Jekyll defaults, restored
  - .sass-cache/
  - .jekyll-cache/
  - node_modules/
  - vendor/
