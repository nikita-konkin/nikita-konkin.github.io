title: Nikita Konkin
tagline: Projects, public articles and engineering updates
description: Персональный сайт с проектами, публичными статьями и заметками по разработке.
url: "https://nikita-konkin.github.io"
baseurl: ""
lang: ru
timezone: Europe/Moscow
markdown: kramdown
permalink: pretty

author:
  name: Nikita Konkin
  role: Full stack developer (or not?)

social:
  github: "https://github.com/nikita-konkin"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# jekyll-feed: publish the articles collection as an Atom feed at /feed.xml
feed:
  collections:
    articles:
      path: "/feed.xml"

collections:
  articles:
    output: true
    permalink: /blog/:path/
  reviews:
    output: true
    permalink: /ai-review/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: "_articles"
      type: articles
    values:
      layout: article
      author: Nikita Konkin
      lang: ru
  - scope:
      path: "_reviews"
      type: reviews
    values:
      layout: review
      lang: ru

exclude:
  - README.md
  - vendor
