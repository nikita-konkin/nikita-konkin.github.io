---
layout: default
---
<section class="page-shell">
  <header class="page-header">
    <p class="eyebrow">{{ site.title }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p class="page-header__lead">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</section>
