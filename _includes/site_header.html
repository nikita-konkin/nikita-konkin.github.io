<header class="site-header">
  <div class="container site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      <span class="site-brand__title">{{ site.title }}</span>
      <span class="site-brand__tagline">{{ site.tagline }}</span>
    </a>

    <nav class="site-nav" aria-label="Основная навигация">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Главная</a>
      <a href="{{ '/projects/' | relative_url }}" {% if page.url == '/projects/' %}aria-current="page"{% endif %}>Проекты</a>
      <a href="{{ '/blog/' | relative_url }}" {% if page.url == '/blog/' %}aria-current="page"{% endif %}>Блог</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>Обо мне</a>
      <a href="{{ site.social.github }}">GitHub</a>
    </nav>
  </div>
</header>
