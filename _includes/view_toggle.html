<div class="view-toggle" role="group" aria-label="{{ include.view_label }}" data-view-toggle="{{ include.storage_key }}">
  <button type="button" class="view-toggle__btn" data-view-btn="list" aria-pressed="true">{{ include.list_label }}</button>
  <button type="button" class="view-toggle__btn" data-view-btn="tiles" aria-pressed="false">{{ include.tiles_label }}</button>
</div>

<script>
(function () {
  var toggle = document.querySelector('[data-view-toggle="{{ include.storage_key }}"]');
  if (!toggle) return;

  var root = document.documentElement;
  var STORAGE_KEY = '{{ include.storage_key }}';

  // The layout itself is applied by the head script via root's data-view, so
  // this only has to keep the buttons in step and record the choice.
  function sync() {
    var view = root.dataset.view === 'tiles' ? 'tiles' : 'list';
    var buttons = toggle.querySelectorAll('[data-view-btn]');
    for (var i = 0; i < buttons.length; i += 1) {
      buttons[i].setAttribute('aria-pressed', String(buttons[i].getAttribute('data-view-btn') === view));
    }
  }

  sync();

  toggle.addEventListener('click', function (event) {
    var btn = event.target.closest('[data-view-btn]');
    if (!btn) return;
    root.dataset.view = btn.getAttribute('data-view-btn');
    sync();
    try { localStorage.setItem(STORAGE_KEY, root.dataset.view); } catch (e) {}
  });
})();
</script>
